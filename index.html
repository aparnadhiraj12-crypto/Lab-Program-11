
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>User Validation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            max-width: 90%;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3046c5;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>User Login</h2>

        <form id="loginForm">
            <input
                type="text"
                id="username"
                placeholder="Enter Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>
        </form>

        <p id="message" role="status"></p>
    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            const button =
                document.getElementById("loginButton");

            message.textContent = "Checking credentials...";
            message.className = "";
            button.disabled = true;

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                message.textContent = data.message;

                if (response.ok) {
                    message.className = "success";
                } else {
                    message.className = "error";
                }

            } catch (error) {
                message.textContent =
                    "Server error. Please try again.";
                message.className = "error";
            } finally {
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
